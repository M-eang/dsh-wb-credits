# dsh-wb-credits 只读快照接口（由 Nginx 反代到 127.0.0.1:8799）
#
# 在 443 那个 server {} 块里 include 本文件，或把下面两段直接贴进去。
# 鉴权不在 Nginx 做：令牌由后端比（X-WB-Token 头），这样令牌不会进 access.log
# 的 URL、不会留在浏览器历史里。
#
# 只有一条路径对外开放，其余 /wb-credits/* 一律 404，免得跟网关自己的路由混。

location = /wb-credits/summary {
    proxy_pass         http://127.0.0.1:8799/summary;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # X-WB-Token 是自定义头，Nginx 默认按原样转发，这里不用再 set。
    proxy_read_timeout 30s;
    proxy_buffering    off;
}

location /wb-credits/ {
    return 404;
}
